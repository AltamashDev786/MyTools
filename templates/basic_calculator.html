<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Basic Calculator — MyTools</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    rgba(110, 90, 255, 0.18),
                    transparent 35%
                ),
                #07080d;

            color: white;

            display: flex;
            flex-direction: column;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            height: 75px;

            padding: 0 6%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-bottom: 1px solid #20232d;

            background: rgba(7, 8, 13, 0.85);

            backdrop-filter: blur(15px);
        }

        .logo {

            text-decoration: none;

            color: white;

            font-size: 22px;

            font-weight: 800;
        }

        .logo span {

            color: #9184ff;
        }

        .nav-links {

            display: flex;

            gap: 28px;
        }

        .nav-links a {

            color: #858998;

            text-decoration: none;

            font-size: 14px;

            transition: 0.2s;
        }

        .nav-links a:hover {

            color: white;
        }


        /* =========================
           MAIN
        ========================= */

        .container {

            width: min(900px, 92%);

            margin: auto;

            padding: 70px 0 100px;

            text-align: center;
        }

        .back {

            display: inline-block;

            margin-bottom: 25px;

            color: #858998;

            text-decoration: none;

            font-size: 13px;
        }

        .back:hover {

            color: white;
        }

        .tag {

            color: #9184ff;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 2px;
        }

        h1 {

            margin-top: 12px;

            font-size: clamp(42px, 7vw, 70px);

            letter-spacing: -3px;

            line-height: 1;
        }

        h1 span {

            background: linear-gradient(
                90deg,
                #9a89ff,
                #4ee5ff
            );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }

        .description {

            max-width: 560px;

            margin: 20px auto 45px;

            color: #777b89;

            font-size: 14px;

            line-height: 1.7;
        }


        /* =========================
           CALCULATOR
        ========================= */

        .calculator {

            max-width: 520px;

            margin: auto;

            padding: 30px;

            border-radius: 24px;

            background: #10121a;

            border: 1px solid #292c39;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35);
        }

        .input-group {

            text-align: left;

            margin-bottom: 20px;
        }

        .input-group label {

            display: block;

            margin-bottom: 8px;

            color: #8b8f9d;

            font-size: 12px;

            font-weight: 600;
        }

        .input-group input {

            width: 100%;

            height: 52px;

            padding: 0 15px;

            border: 1px solid #292c39;

            border-radius: 10px;

            outline: none;

            background: #181b25;

            color: white;

            font-size: 16px;
        }

        .input-group input:focus {

            border-color: #7770ff;
        }


        /* =========================
           OPERATION BUTTONS
        ========================= */

        .operations {

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 10px;

            margin-top: 25px;
        }

        .operation-button {

            height: 52px;

            border: 1px solid #292c39;

            border-radius: 10px;

            background: #181b25;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .operation-button:hover {

            background: #242838;

            border-color: #7770ff;
        }

        .operation-button.add:hover {

            color: #65e5ff;
        }

        .operation-button.subtract:hover {

            color: #a18fff;
        }

        .operation-button.multiply:hover {

            color: #ff8fc9;
        }

        .operation-button.divide:hover {

            color: #7affac;
        }


        /* =========================
           RESULT
        ========================= */

        .result-box {

            margin-top: 28px;

            padding: 22px;

            border-radius: 15px;

            background: #171a24;

            border: 1px solid #292c39;
        }

        .result-title {

            color: #737785;

            font-size: 11px;

            letter-spacing: 1.5px;

            font-weight: 700;
        }

        .result {

            margin-top: 7px;

            font-size: 32px;

            font-weight: 800;

            color: #9b90ff;

            word-break: break-word;
        }

        .error {

            margin-top: 7px;

            color: #ff6f91;

            font-size: 14px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .nav-links {

                display: none;
            }

            .container {

                padding-top: 50px;
            }

            .calculator {

                padding: 22px;
            }

            .operations {

                grid-template-columns: repeat(2, 1fr);
            }

            h1 {

                letter-spacing: -2px;
            }
        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <a href="/" class="logo">
            ✦ My<span>Tools</span>
        </a>

        <nav class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/calculators">
                Calculators
            </a>

        </nav>

    </header>


    <!-- MAIN -->

    <main class="container">

        <a href="/calculators" class="back">
            ← Back to Calculators
        </a>

        <div class="tag">
            ✦ BASIC CALCULATOR
        </div>

        <h1>
            Simple math,
            <br>
            <span>made easy.</span>
        </h1>

        <p class="description">
            Perform basic addition, subtraction,
            multiplication and division quickly.
        </p>


        <!-- CALCULATOR -->

        <section class="calculator">

            <form method="POST">


                <!-- NUMBER 1 -->

                <div class="input-group">

                    <label>
                        FIRST NUMBER
                    </label>

                    <input
                        type="number"
                        name="number1"
                        step="any"
                        placeholder="Enter first number"
                        required
                    >

                </div>


                <!-- NUMBER 2 -->

                <div class="input-group">

                    <label>
                        SECOND NUMBER
                    </label>

                    <input
                        type="number"
                        name="number2"
                        step="any"
                        placeholder="Enter second number"
                        required
                    >

                </div>


                <!-- OPERATIONS -->

                <div class="operations">

                    <button
                        type="submit"
                        name="operation"
                        value="add"
                        class="operation-button add">
                        ＋ Add
                    </button>

                    <button
                        type="submit"
                        name="operation"
                        value="subtract"
                        class="operation-button subtract">
                        − Subtract
                    </button>

                    <button
                        type="submit"
                        name="operation"
                        value="multiply"
                        class="operation-button multiply">
                        × Multiply
                    </button>

                    <button
                        type="submit"
                        name="operation"
                        value="divide"
                        class="operation-button divide">
                        ÷ Divide
                    </button>

                </div>


                <!-- RESULT -->

                {% if result is not none %}

                <div class="result-box">

                    <div class="result-title">
                        RESULT
                    </div>

                    <div class="result">
                        {{ result }}
                    </div>

                </div>

                {% endif %}


                {% if error %}

                <div class="result-box">

                    <div class="result-title">
                        ERROR
                    </div>

                    <div class="error">
                        {{ error }}
                    </div>

                </div>

                {% endif %}


            </form>

        </section>

    </main>

</body>

</html>
